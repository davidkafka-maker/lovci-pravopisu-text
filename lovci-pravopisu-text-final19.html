<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Lovci pravopisu – text</title>
<style>
:root {
  --bg1:#111827; --bg2:#1e293b; --card:#fff7ed; --ink:#1f2937;
  --accent:#f97316; --accent2:#facc15; --good:#16a34a; --bad:#dc2626;
}
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: radial-gradient(circle at top, #334155 0, var(--bg1) 48%, #020617 100%);
  color:white; display:flex; align-items:center; justify-content:center; padding:14px;
}
.app {
  width:min(760px, 100%); min-height:min(920px, 100vh); display:flex; flex-direction:column; gap:12px;
}
.header { text-align:center; padding:8px 4px 0; }
h1 { margin:0; font-size:clamp(28px, 7vw, 48px); letter-spacing:.5px; }
.subtitle { color:#fde68a; font-weight:700; margin-top:4px; font-size:15px; }
.panel {
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16);
  border-radius:24px; padding:14px; box-shadow:0 18px 50px rgba(0,0,0,.35);
}
.menu {
  flex:1; display:flex; flex-direction:column; justify-content:center; gap:16px;
}
.bigbtn {
  border:0; border-radius:22px; padding:18px 16px; font-size:clamp(22px, 6vw, 34px);
  font-weight:900; color:#111827; background:linear-gradient(135deg,#fde68a,#fb923c);
  box-shadow:0 10px 0 #9a3412, 0 18px 35px rgba(0,0,0,.35); cursor:pointer;
}
.bigbtn:active { transform:translateY(4px); box-shadow:0 6px 0 #9a3412; }
.smallbtn {
  border:0; border-radius:15px; padding:12px 14px; font-weight:900; font-size:16px;
  background:#e5e7eb; color:#111827; cursor:pointer;
}
.gameTop { display:flex; justify-content:space-between; align-items:center; gap:8px; font-weight:900; }
.badge { background:#0f172a; color:#fde68a; border:1px solid rgba(255,255,255,.15); padding:8px 10px; border-radius:999px; }
.textbox {
  background:var(--card); color:var(--ink); border-radius:22px; padding:18px; line-height:1.43;
  font-size:clamp(18px, 4.8vw, 27px); font-weight:650; box-shadow:inset 0 0 0 3px rgba(249,115,22,.35);
}
mark.badword, .word.badword, .badword {
  background:#ef4444 !important;
  color:#ffffff !important;
  padding:0 .18em;
  border-radius:.28em;
  box-shadow:0 0 0 3px #7f1d1d inset, 0 0 14px rgba(239,68,68,.85);
  font-weight:1000;
}
.prompt { text-align:center; font-weight:900; color:#fde68a; font-size:18px; margin-top:4px; }
.answerRow { display:flex; gap:10px; align-items:center; }
input {
  width:100%; border:3px solid transparent; border-radius:18px; padding:15px 14px;
  font-size:clamp(22px, 6vw, 32px); font-weight:900; text-align:center; outline:none;
}
input.bad { border-color:var(--bad); background:#fee2e2; color:#7f1d1d; }
input.good { border-color:var(--good); background:#dcfce7; color:#14532d; }
.check {
  min-width:84px; border:0; border-radius:18px; padding:15px 12px; font-size:22px; font-weight:1000;
  background:linear-gradient(135deg,#86efac,#22c55e); color:#052e16; cursor:pointer;
}
.feedback {
  min-height:58px; display:flex; align-items:center; justify-content:center; text-align:center;
  font-weight:1000; font-size:clamp(25px,7vw,42px);
}
.feedback.good { color:#86efac; }
.feedback.bad { color:#fecaca; }
.hint { font-size:16px; text-align:center; color:#fde68a; font-weight:800; min-height:24px; }
.end {
  display:flex; flex:1; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:20px;
}
.grade { font-size:clamp(44px,13vw,92px); font-weight:1000; color:#fde68a; text-shadow:0 6px 0 #7c2d12; }
.hidden { display:none !important; }
@media (max-width: 420px) {
  body { padding:8px; align-items:flex-start; }
  .app { gap:8px; }
  .panel { padding:10px; border-radius:18px; }
  .textbox { padding:13px; font-size:18px; line-height:1.35; }
  .answerRow { flex-direction:column; }
  .check { width:100%; }
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Lovci pravopisu</h1>
    <div class="subtitle">Zapiš chybné slovo správně</div>
  </div>

  <section id="menu" class="panel menu">
    <button class="bigbtn" onclick="startGame('training')">TRÉNINK</button>
    <button class="bigbtn" onclick="startGame('sharp')">NAOSTRO</button>
    <div class="hint">V tréninku uvidíš správnou podobu. V režimu NAOSTRO potřebuješ 10 správných odpovědí.</div>
  </section>

  <section id="game" class="panel hidden">
    <div class="gameTop">
      <div class="badge" id="modeBadge">TRÉNINK</div>
      <div class="badge">Čas: <span id="timer">30</span> s</div>
      <div class="badge">Série: <span id="streak">0</span>/10</div>
      <div id="topResult" class="topResult"></div>
      <button class="smallbtn" onclick="backToMenu()">Menu</button>
    </div>
    <div class="prompt">Zapiš chybné slovo správně.</div>
    <div id="text" class="textbox"></div>
    <div class="answerRow">
      <input id="answer" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="oprav chybné slovo" />
      <button id="checkBtn" class="check" onclick="mainButton()">OK</button>
    </div>
    <div id="feedback" class="feedback"></div>
    <div id="hint" class="hint"></div>
    <button id="nextBtn" class="smallbtn hidden" onclick="nextQuestion()" style="display:none">DALŠÍ</button>
  </section>

  <section id="end" class="panel end hidden">
    <div class="grade">MÁŠ JEDNIČKU!</div>
    <button class="bigbtn" onclick="startGame('sharp')">Znovu NAOSTRO</button>
    <button class="smallbtn" onclick="backToMenu()">Zpět do menu</button>
  </section>
</div>

let deck = [];
let index = 0;
let current = null;
let mode = "training";
let locked = false;
let streak = 0;
let timeLeft = 30;
let timerId = null;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function norm(s) {
  return (s || "").trim().toLowerCase().replace(/[.,;:!?„“"()]/g, "");
}

function startGame(selectedMode) {
  mode = selectedMode;
  deck = shuffle(DATA);
  index = 0;
  streak = 0;
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("end").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  document.getElementById("modeBadge").textContent = mode === "sharp" ? "NAOSTRO" : "TRÉNINK";
  nextQuestion();
}

function backToMenu() {
  stopTimer();
  document.getElementById("game").classList.add("hidden");
  document.getElementById("end").classList.add("hidden");
  document.getElementById("menu").classList.remove("hidden");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function escapeRegExp(s) {
  return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function renderText(item, reveal=false) {
  if (!reveal) return escapeHtml(item.text);

  const idx = item.badIndex;
  const len = item.badLength;

  if (typeof idx !== "number" || idx < 0 || !len) return escapeHtml(item.text);

  const before = escapeHtml(item.text.slice(0, idx));
  const match = escapeHtml(item.text.slice(idx, idx + len));
  const after = escapeHtml(item.text.slice(idx + len));

  return before + '<mark class="badword">' + match + '</mark>' + after;
}


function stopTimer() {
  if (timerId) clearInterval(timerId);
  timerId = null;
}

function startTimer() {
  stopTimer();
  timeLeft = 30;
  document.getElementById("timer").textContent = timeLeft;
  timerId = setInterval(() => {
    if (locked) return;
    timeLeft--;
    document.getElementById("timer").textContent = timeLeft;
    if (timeLeft <= 0) {
      stopTimer();
      timeUp();
    }
  }, 1000);
}

function timeUp() {
  if (locked) return;
  locked = true;
  const input = document.getElementById("answer");
  input.classList.add("bad");
  const top = document.getElementById("topResult");
  top.textContent = "✗"; top.style.fontSize="64px"; top.style.color="#ef4444";
  top.className = "topResult bad";
  document.getElementById("text").innerHTML = renderText(current, true);
  playSound("bad");
  if (mode === "training") {
    document.getElementById("hint").textContent = `Čas vypršel. Oprav chybné slovo: ${current.correct}.`;
  } else {
    streak = 0;
    document.getElementById("streak").textContent = streak;
    document.getElementById("hint").textContent = `Čas vypršel. Správně: ${current.correct}. Série začíná znovu.`;
  }
  document.getElementById("checkBtn").textContent = "DALŠÍ";
}

function nextQuestion() {
  if (index >= deck.length) deck = shuffle(DATA), index = 0;
  current = deck[index++];
  locked = false;
  document.getElementById("text").innerHTML = renderText(current, false);
  const input = document.getElementById("answer");
  document.getElementById("checkBtn").textContent = "OK";
  input.value = "";
  input.className = "";
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback";
  document.getElementById("hint").textContent = "";
  document.getElementById("nextBtn").classList.add("hidden");
  document.getElementById("streak").textContent = streak;
  const top = document.getElementById("topResult");
  top.textContent = ""; top.style.fontSize=""; top.style.color="";
  top.className = "topResult";
  startTimer();
  setTimeout(() => input.focus(), 80);
}

function playSound(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    if (type === "good") {
      osc.frequency.setValueAtTime(660, ctx.currentTime);
      osc.frequency.setValueAtTime(880, ctx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.08, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
      osc.start(); osc.stop(ctx.currentTime + 0.24);
    } else {
      osc.frequency.setValueAtTime(180, ctx.currentTime);
      osc.frequency.setValueAtTime(120, ctx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.08, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
      osc.start(); osc.stop(ctx.currentTime + 0.3);
    }
  } catch(e) {}
}

function mainButton() {
  if (locked) {
    nextQuestion();
  } else {
    checkAnswer();
  }
}

function checkAnswer() {
  if (locked) return;
  const input = document.getElementById("answer");
  const val = norm(input.value);
  const good = val === norm(current.correct);
  const feedback = document.getElementById("feedback");
  const hint = document.getElementById("hint");
  locked = true;
  stopTimer();

  if (good) {
    input.classList.add("good");
    feedback.textContent = "";
    const top = document.getElementById("topResult");
    top.textContent = "✓"; top.style.fontSize="64px"; top.style.color="#22c55e";
    top.className = "topResult good";
    playSound("good");
    streak++;
    document.getElementById("streak").textContent = streak;
    if (mode === "sharp" && streak >= 10) {
      setTimeout(() => {
        document.getElementById("game").classList.add("hidden");
        document.getElementById("end").classList.remove("hidden");
      }, 800);
      return;
    }
    setTimeout(nextQuestion, 1100);
  } else {
    input.classList.add("bad");
    feedback.textContent = "";
    const top = document.getElementById("topResult");
    top.textContent = "✗"; top.style.fontSize="64px"; top.style.color="#ef4444";
    top.className = "topResult bad";
    document.getElementById("text").innerHTML = renderText(current, true);
    playSound("bad");
    if (mode === "training") {
      hint.textContent = `Oprav chybné slovo: ${current.correct}.`;
    } else {
      hint.textContent = `Správně: ${current.correct}. Série začíná znovu.`;
      streak = 0;
      document.getElementById("streak").textContent = streak;
    }
    document.getElementById("checkBtn").textContent = "DALŠÍ";
  }
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !document.getElementById("game").classList.contains("hidden")) {
    if (!locked) checkAnswer();
  }
});
